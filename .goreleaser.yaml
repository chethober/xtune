version: 2
project_name: xtune

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    # desktop (Linux also covers servers) and Android (Termux)
    goos: [linux, darwin, windows, android]
    goarch: [amd64, arm64]
    ignore:
      - goos: android
        goarch: amd64 # needs cgo
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, CHANGELOG.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:"]

release:
  github:
    owner: chethober
    name: xtune
  name_template: "v{{ .Version }}"
