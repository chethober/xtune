name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release from this commit (e.g. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          v="v${{ inputs.version }}"
          v="${v#vv}"; v="v${v#v}"
          git tag "$v"
          git push origin "$v"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Posts the version's CHANGELOG.md section to the CHTH updates channel through the hub.
      - name: Announce release
        env:
          CHTH_HUB_URL: ${{ secrets.CHTH_HUB_URL }}
          CHTH_RELEASE_SECRET: ${{ secrets.CHTH_RELEASE_SECRET }}
          RELEASE_PRODUCT: xtune
          RELEASE_NAME: xtune
          RELEASE_HOME: ${{ github.server_url }}/${{ github.repository }}
          RELEASE_CHANGELOG: CHANGELOG.md
        run: |
          tag="$(git describe --tags --abbrev=0)"
          RELEASE_VERSION="$tag" RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" \
            node .github/scripts/announce-release.mjs
