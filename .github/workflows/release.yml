name: release

# Push a tag like v1.0.0 to build Android, Linux and Windows and publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to build, e.g. v1.0.1
        default: v0.0.0-test
      publish:
        description: publish a release (creating the tag at this commit)
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  FLUTTER_VERSION: 3.50.0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Android lint needs it
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: core (gomobile)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: scripts/build-android-core.sh "$VERSION"
      - name: signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/android/key.properties
      - name: build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --build-name="${VERSION#v}" --build-number="${{ github.run_number }}"
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/xtune-$VERSION-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  linux:
    runs-on: ubuntu-22.04 # older glibc: runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev ninja-build clang cmake
      - name: build
        run: |
          (cd app && flutter pub get)
          scripts/build-desktop.sh linux "$VERSION"
          cp packaging/linux/* app/build/linux/x64/release/bundle/
          mkdir -p dist
          tar -C app/build/linux/x64/release -czf "dist/xtune-$VERSION-linux-x64.tar.gz" --transform 's,^bundle,xtune,' bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: build
        run: |
          (cd app && flutter pub get)
          scripts/build-desktop.sh windows "$VERSION"
          out=app/build/windows/x64/runner/Release
          # Wintun, the TUN driver Xray uses on Windows (whole-device mode)
          curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          sha256sum wintun.zip # recorded in the log; pin it here once confirmed against wintun.net
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll "$out/"
          cp wintun/LICENSE.txt "$out/wintun-LICENSE.txt"
          mkdir -p dist
          (cd "$out" && 7z a -tzip "$GITHUB_WORKSPACE/dist/xtune-$VERSION-windows-x64.zip" . >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  publish:
    if: github.ref_type == 'tag' || inputs.publish
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
