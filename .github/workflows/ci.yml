name: ci

# The CLI (cli/). The app has its own checks in app-ci.yml.
on:
  push:
    branches: [main]
    paths: ['cli/**', 'install.sh', 'install.ps1', '.github/workflows/ci.yml']
  pull_request:
    paths: ['cli/**', 'install.sh', 'install.ps1', '.github/workflows/ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - run: go test -shuffle=on ./...
      - run: go build -trimpath -o xtune-bin .

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # amneziawg-go keeps its packet settings in package globals, which races when the AmneziaWG
      # end-to-end tests run a server and clients in one process; xtune runs one device per process
      - run: go test -race -skip 'TestAWGEndToEnd|TestAWGPeerReload' ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: shellcheck
        run: shellcheck pkg/remote/helper.sh ../install.sh
      - name: docs links
        run: python3 scripts/check-links.py

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: build every release target
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 android/arm64; do
            echo "== $t"; GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null . || exit 1
          done
